<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>簡易點餐與出餐系統</title>
    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; --text: #1C1C1E; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: var(--bg); color: var(--text); }
        nav { display: flex; background: white; padding: 10px; border-bottom: 1px solid #ccc; position: sticky; top: 0; z-index: 100; overflow-x: auto; white-space: nowrap;}
        nav button { flex: 1; padding: 10px; margin: 0 3px; border: none; border-radius: 8px; background: #e5e5ea; font-size: 15px; cursor: pointer; min-width: 90px;}
        nav button.active { background: var(--primary); color: white; }
        .container { padding: 15px; display: none; }
        .container.active { display: block; }
        
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; font-family: inherit;}
        textarea { resize: vertical; height: 60px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-bottom: 10px; font-weight: bold;}
        .btn-blue { background: var(--primary); color: white; }
        .btn-green { background: #34C759; color: white; }
        .btn-red { background: #FF3B30; color: white; }
        .btn-orange { background: #FF9500; color: white; }
        
        .list-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; align-items: center;}
        .total-price { font-size: 24px; font-weight: bold; text-align: right; margin: 15px 0; color: #FF3B30; }
        
        .kitchen-task { border-left: 6px solid #FF9500; display: flex; justify-content: space-between; align-items: center; }
        .history-card { padding: 12px; border: 1px solid #e5e5ea; border-radius: 8px; margin-bottom: 10px; background: #fafafa; }
        .history-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ccc; padding-bottom: 8px; margin-bottom: 8px; font-size: 14px;}
        .history-items { font-size: 13px; color: #555; line-height: 1.6; }
        
        .select-row { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        .select-row select, .select-row input { margin: 0; }
        .select-row button { margin: 0; width: auto; padding: 10px 20px; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .dash-box { padding: 10px; border-radius: 8px; text-align: center; }
        .dash-title { font-size: 12px; color: #666; display: block; margin-bottom: 5px; }
        .dash-value { font-size: 20px; font-weight: bold; }

        .pax-control { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .pax-control input { margin: 0; text-align: center; flex: 1; font-weight: bold; font-size: 18px;}
        .pax-btn { background: #e5e5ea; border: none; font-size: 22px; font-weight: bold; border-radius: 8px; width: 45px; height: 45px; cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center;}
    </style>
</head>
<body>

    <nav>
        <button id="tab-order" class="active" onclick="switchTab('order')">🍽️ 桌位點餐</button>
        <button id="tab-reservation" onclick="switchTab('reservation')">📝 訂位管理</button>
        <button id="tab-kitchen" onclick="switchTab('kitchen')">👨‍🍳 廚房出餐</button>
        <button id="tab-menu" onclick="switchTab('menu')">📂 菜單管理</button>
        <button id="tab-summary" onclick="switchTab('summary')">📊 今日帳務</button>
    </nav>

    <div id="order-view" class="container active">
        <div class="card">
            <label>選擇桌號：</label>
            <select id="table-select" onchange="loadTableData()">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="吧檯">吧檯</option>
                <option value="沙發區">沙發區</option>
            </select>
            
            <label>併桌標記 (選填)：</label>
            <input type="text" id="merge-note" placeholder="例如：1+2 或 併入3桌" oninput="saveTableData()">

            <label>用餐人數：</label>
            <div class="pax-control">
                <button class="pax-btn" onclick="changePax(-1)">-</button>
                <input type="number" id="pax-input" placeholder="人數" value="2" onchange="saveTableData()">
                <button class="pax-btn" onclick="changePax(1)">+</button>
            </div>
        </div>

        <div class="card">
            <h3>選擇餐點</h3>
            <label>🍱 食物類：</label>
            <div class="select-row">
                <select id="food-select" style="flex:1;"></select>
                <button class="btn btn-blue" onclick="addFromSelect('food-select')">加入</button>
            </div>
            <label>🥤 飲品類：</label>
            <div class="select-row">
                <select id="drink-select" style="flex:1;"></select>
                <button class="btn btn-blue" onclick="addFromSelect('drink-select')">加入</button>
            </div>
        </div>

        <div class="card">
            <h3>目前桌邊餐點</h3>
            <div id="cart-list"></div>
            <div class="total-price">總計: $<span id="cart-total">0</span></div>
            <label>本次點餐備註：</label>
            <textarea id="order-remark" placeholder="例如：飯少、盡快上菜..."></textarea>
            <button class="btn btn-orange" onclick="sendOrder()">📤 送出點餐至廚房</button>
            <div style="margin-top: 25px; border-top: 2px dashed #ccc; padding-top: 15px;">
                <button class="btn btn-blue" onclick="checkout('現金')">💵 現金結帳並清空</button>
                <button class="btn btn-green" onclick="checkout('LINE Pay')">📱 LINE Pay 結帳並清空</button>
            </div>
        </div>
    </div>

    <div id="reservation-view" class="container">
        <div class="card">
            <h3>新增訂位</h3>
            <p style="font-size: 14px; color: #666;">格式：名稱,時間,人數 (例如：程小姐,21:00,x2)</p>
            <div class="select-row">
                <input type="text" id="res-input" placeholder="程小姐,21:00,x2" style="flex: 1;">
                <button class="btn btn-blue" onclick="addReservation()">新增訂位</button>
            </div>
        </div>
        <div class="card">
            <h3>今日訂位列表 (依時間排序)</h3>
            <div id="reservation-list"></div>
        </div>
    </div>

    <div id="kitchen-view" class="container">
        <div class="card">
            <h3>待出餐排序 (越上層越早點)</h3>
            <div id="kitchen-list"></div>
        </div>
    </div>

    <div id="menu-view" class="container">
        <div class="card">
            <h3>新增品項</h3>
            <input type="text" id="new-item-name" placeholder="品項名稱">
            <input type="number" id="new-item-price" placeholder="價格">
            <select id="new-item-category">
                <option value="食物">食物</option>
                <option value="飲品">飲品</option>
            </select>
            <button class="btn btn-blue" onclick="addMenuItem()">新增至菜單</button>
        </div>
        <div class="card">
            <h3>現有菜單</h3>
            <div id="admin-menu-list"></div>
        </div>
    </div>

    <div id="summary-view" class="container">
        <div class="card">
            <h3>營業統計</h3>
            <div class="dashboard-grid">
                <div class="dash-box" style="background: #e5e5ea;"><span class="dash-title">💰 營業額</span><span class="dash-value" id="dash-revenue">$0</span></div>
                <div class="dash-box" style="background: #ffebee;"><span class="dash-title">💸 總支出</span><span class="dash-value" style="color: #FF3B30;" id="dash-expense">$0</span></div>
                <div class="dash-box" style="background: #e8f5e9;"><span class="dash-title">💵 現金</span><span class="dash-value" style="color: #34C759;" id="dash-cash">$0</span></div>
                <div class="dash-box" style="background: #e3f2fd;"><span class="dash-title">📱 LINE Pay</span><span class="dash-value" style="color: #007AFF;" id="dash-linepay">$0</span></div>
            </div>
            <div class="dash-box" style="background: #fff3e0; border: 2px solid #FF9500;"><span class="dash-title">🏆 淨利</span><span class="dash-value" style="font-size: 28px; color: #FF9500;" id="dash-profit">$0</span></div>
            <h3 style="margin-top: 20px;">新增支出</h3>
            <div class="select-row"><input type="text" id="expense-name" placeholder="品項" style="flex:2;"><input type="number" id="expense-amount" placeholder="金額" style="flex:1;"><button class="btn btn-red" onclick="addExpense()">紀錄</button></div>
            <div id="expense-list"></div>
        </div>
        <div class="card"><h3>帳單明細</h3><div id="history-list"></div><br><button class="btn btn-red" onclick="endOfDay()">執行日結 (歸零)</button></div>
    </div>

    <script>
        // --- 核心資料 ---
        const defaultMenu = [
            { id: 101, name: '美式咖啡 (冰)', price: 150, category: '飲品' },
            { id: 102, name: '美式咖啡 (熱)', price: 150, category: '飲品' },
            { id: 103, name: '西西里咖啡 (冰)', price: 180, category: '飲品' },
            { id: 104, name: '拿鐵 (冰)', price: 180, category: '飲品' },
            { id: 105, name: '拿鐵 (熱)', price: 180, category: '飲品' },
            { id: 106, name: '焦糖烤花生風味拿鐵 (冰)', price: 190, category: '飲品' },
            { id: 107, name: '焦糖烤花生風味拿鐵 (熱)', price: 190, category: '飲品' },
            { id: 108, name: '榛果風味拿鐵 (冰)', price: 190, category: '飲品' },
            { id: 109, name: '榛果風味拿鐵 (熱)', price: 190, category: '飲品' },
            { id: 110, name: '蜂蜜風味拿鐵 (冰)', price: 190, category: '飲品' },
            { id: 111, name: '蜂蜜風味拿鐵 (熱)', price: 190, category: '飲品' },
            { id: 214, name: '玫瑰安神花草茶(無咖啡因) (熱/可回沖)', price: 180, category: '飲品' },
            { id: 215, name: '薰衣草安神花草茶(無咖啡因) (熱/可回沖)', price: 180, category: '飲品' },
            { id: 301, name: '漂浮可樂 (冰)', price: 170, category: '飲品' },
            { id: 302, name: '漂浮咖啡 (冰)', price: 170, category: '飲品' },
            { id: 303, name: '鮮奶油可可飲 (冰)', price: 180, category: '飲品' },
            { id: 304, name: '鮮奶油可可飲 (熱)', price: 180, category: '飲品' },
            { id: 401, name: '牛五花丼飯', price: 230, category: '食物' },
            { id: 402, name: '豬五花丼飯', price: 220, category: '食物' },
            { id: 403, name: '香料火腿起司拼盤', price: 380, category: '食物' },
            { id: 404, name: '高麗菜豬肉水餃', price: 150, category: '食物' }
        ];

        let menu = JSON.parse(localStorage.getItem('pos_menu_v6')) || defaultMenu;
        let tables = JSON.parse(localStorage.getItem('pos_tables')) || {};
        ['1','2','3','4','5','吧檯','沙發區'].forEach(t => { if(!tables[t]) tables[t] = { pax: 0, cart: [], mergeNote: "" }; });
        let kitchenQueue = JSON.parse(localStorage.getItem('pos_kitchen')) || [];
        let history = JSON.parse(localStorage.getItem('pos_history')) || [];
        let expenses = JSON.parse(localStorage.getItem('pos_expenses')) || []; 
        let reservations = JSON.parse(localStorage.getItem('pos_reservations')) || [];
        let currentTable = "1";

        function switchTab(tabName) {
            document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName + '-view').classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
            if(tabName === 'order') { renderOrderView(); renderCart(); }
            if(tabName === 'reservation') renderReservations();
            if(tabName === 'kitchen') renderKitchenView();
            if(tabName === 'menu') renderMenuAdmin();
            if(tabName === 'summary') renderSummary();
        }

        // --- 訂位系統 ---
        function addReservation() {
            let inputStr = document.getElementById('res-input').value.trim();
            if(!inputStr) return;
            inputStr = inputStr.replace(/，/g, ',');
            let parts = inputStr.split(',');
            if(parts.length < 3) return alert('格式錯誤');
            reservations.push({ id: Date.now(), name: parts[0], time: parts[1], pax: parts[2], arrived: false });
            document.getElementById('res-input').value = '';
            saveData(); renderReservations();
        }

        function toggleReservation(id) {
            let res = reservations.find(r => r.id == id);
            if(res) { res.arrived = !res.arrived; saveData(); renderReservations(); }
        }

        function renderReservations() {
            const list = document.getElementById('reservation-list');
            list.innerHTML = '';
            // 💡 關鍵修復：強制依照 00:00~23:59 排序
            reservations.sort((a, b) => a.time.localeCompare(b.time));
            reservations.forEach(res => {
                let btnClass = res.arrived ? "btn-green" : "btn-orange";
                let btnText = res.arrived ? "✅ 已入座" : "等候中";
                list.innerHTML += `<div class="list-item" style="opacity:${res.arrived ? 0.5 : 1}"><div><span style="font-size:20px; font-weight:bold; color:var(--primary)">${res.time}</span> <span style="font-size:18px; margin-left:10px;">${res.name}</span> <small>(${res.pax})</small></div><button onclick="toggleReservation('${res.id}')" class="btn ${btnClass}" style="width:auto; margin:0;">${btnText}</button></div>`;
            });
        }

        // --- 桌位與點餐 ---
        function renderOrderView() {
            const food = document.getElementById('food-select');
            const drink = document.getElementById('drink-select');
            food.innerHTML = drink.innerHTML = '';
            menu.forEach(item => {
                const opt = `<option value="${item.id}">${item.name} ($${item.price})</option>`;
                if(item.category === '食物') food.innerHTML += opt; else drink.innerHTML += opt;
            });
            loadTableData();
        }

        function updateTableDisplay() {
            const select = document.getElementById('table-select');
            for (let i = 0; i < select.options.length; i++) {
                let t = select.options[i].value;
                let cart = tables[t].cart;
                let cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                let mergeTag = tables[t].mergeNote ? ` (${tables[t].mergeNote})` : ""; // 💡 併桌呈現
                let status = cartTotal > 0 ? (cart.every(it => it.status === 'served') ? ` - ✅齊餐` : ` - $${cartTotal}`) : " (空)";
                select.options[i].text = `${t}${mergeTag}${status}`;
            }
        }

        function loadTableData() {
            currentTable = document.getElementById('table-select').value;
            document.getElementById('pax-input').value = tables[currentTable].pax || '';
            document.getElementById('merge-note').value = tables[currentTable].mergeNote || ''; // 載入併桌備註
            document.getElementById('order-remark').value = '';
            renderCart();
        }

        function saveTableData() {
            tables[currentTable].pax = document.getElementById('pax-input').value;
            tables[currentTable].mergeNote = document.getElementById('merge-note').value; // 儲存併桌備註
            saveData(); updateTableDisplay();
        }

        function changePax(delta) {
            let input = document.getElementById('pax-input');
            input.value = Math.max(0, (parseInt(input.value)||0) + delta);
            saveTableData();
        }

        function addFromSelect(id) {
            const itemId = parseInt(document.getElementById(id).value);
            if(!itemId) return;
            const item = menu.find(m => m.id === itemId);
            const cart = tables[currentTable].cart;
            const unsent = cart.find(c => c.id === itemId && c.status === 'unsent');
            if(unsent) unsent.qty++; else cart.push({ ...item, qty: 1, status: 'unsent' });
            if(tables[currentTable].pax == 0) { tables[currentTable].pax = 1; document.getElementById('pax-input').value = 1; }
            saveTableData(); renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            list.innerHTML = ''; let total = 0;
            tables[currentTable].cart.forEach((it, idx) => {
                total += it.price * it.qty;
                let badge = it.status==='preparing'?'<span style="color:#FF9500;">(製作中)</span>':it.status==='served'?'<span style="color:#34C759;">(已出餐)</span>':'';
                let btn = it.status==='unsent' ? `<button onclick="removeCart(${idx})" style="background:#ccc; border:none; border-radius:5px;">-1</button>` : `<span style="font-size:12px; color:#999;">${it.status==='served'?'✅':'👨‍🍳'}</span>`;
                list.innerHTML += `<div class="list-item"><span>${it.name} x ${it.qty} ${badge}<br><small>$${it.price*it.qty}</small></span>${btn}</div>`;
            });
            document.getElementById('cart-total').innerText = total;
            updateTableDisplay();
        }

        function removeCart(idx) {
            const cart = tables[currentTable].cart;
            if(--cart[idx].qty === 0) cart.splice(idx, 1);
            saveData(); renderCart();
        }

        function sendOrder() {
            const unsent = tables[currentTable].cart.filter(it => it.status === 'unsent');
            if(unsent.length === 0) return alert('無新餐點');
            const remark = document.getElementById('order-remark').value;
            const time = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
            unsent.forEach(it => {
                it.status = 'preparing'; it.taskId = Date.now() + Math.random();
                kitchenQueue.push({ taskId: it.taskId, table: currentTable, name: it.name, qty: it.qty, remark, time });
            });
            document.getElementById('order-remark').value = '';
            saveData(); alert('已送至廚房'); renderCart();
        }

        // --- 廚房出餐 ---
        function renderKitchenView() {
            const list = document.getElementById('kitchen-list');
            list.innerHTML = kitchenQueue.length ? '' : '<center>尚無待辦</center>';
            kitchenQueue.forEach(q => {
                list.innerHTML += `<div class="card kitchen-task"><div><span style="background:#eee; padding:3px 8px; border-radius:5px;">桌號: <strong>${q.table}</strong></span> <small>${q.time}</small><div style="font-size:18px; font-weight:bold;">${q.name} x ${q.qty}</div>${q.remark?`<div style="color:red; font-size:14px;">備註: ${q.remark}</div>`:''}</div><button class="btn btn-green" style="width:auto;" onclick="markServed('${q.taskId}','${q.table}')">✅ 出餐</button></div>`;
            });
        }

        function markServed(id, t) {
            kitchenQueue = kitchenQueue.filter(q => q.taskId !== id);
            const item = tables[t].cart.find(it => it.taskId == id);
            if(item) item.status = 'served';
            saveData(); renderKitchenView();
        }

        // --- 結帳 ---
        function checkout(m) {
            const cart = tables[currentTable].cart;
            if(!cart.length) return alert('空桌');
            if(kitchenQueue.some(q => q.table === currentTable)) if(!confirm('尚有餐點製作中，確定結帳？')) return;
            history.push({ table: currentTable, pax: tables[currentTable].pax, total: parseInt(document.getElementById('cart-total').innerText), method: m, time: new Date().toLocaleTimeString(), items: JSON.parse(JSON.stringify(cart)) });
            tables[currentTable] = { pax: 0, cart: [], mergeNote: "" };
            kitchenQueue = kitchenQueue.filter(q => q.table !== currentTable);
            saveData(); alert('結帳完成'); loadTableData();
        }

        // --- 菜單與帳務 ---
        function addMenuItem() {
            const name = document.getElementById('new-item-name').value;
            const price = parseInt(document.getElementById('new-item-price').value);
            const category = document.getElementById('new-item-category').value;
            if(!name || !price) return alert('資訊不全');
            menu.push({ id: Date.now(), name, price, category });
            saveData(); renderMenuAdmin();
        }
        function removeMenuItem(idx) { menu.splice(idx, 1); saveData(); renderMenuAdmin(); }
        function renderMenuAdmin() {
            const list = document.getElementById('admin-menu-list'); list.innerHTML = '';
            menu.forEach((it, idx) => list.innerHTML += `<div class="list-item"><span>${it.name} ($${it.price})</span><button onclick="removeMenuItem(${idx})" class="btn-red" style="padding:5px;">刪除</button></div>`);
        }
        function addExpense() {
            const n = document.getElementById('expense-name').value;
            const a = parseInt(document.getElementById('expense-amount').value);
            if(!n || !a) return alert('不全');
            expenses.push({ name: n, amount: a }); saveData(); renderSummary();
        }
        function removeExpense(idx) { expenses.splice(idx,1); saveData(); renderSummary(); }
        function renderSummary() {
            let total=0, cash=0, lp=0, exp=0;
            const list = document.getElementById('history-list'); list.innerHTML = '';
            history.slice().reverse().forEach(h => {
                total += h.total; if(h.method==='現金') cash += h.total; else lp += h.total;
                list.innerHTML += `<div class="history-card"><div class="history-header"><strong>${h.table}</strong> | ${h.method} | ${h.time}</div><div>${h.items.map(it=>`🔸${it.name}x${it.qty}`).join('<br>')}</div><div style="text-align:right; color:red;">$${h.total}</div></div>`;
            });
            const expList = document.getElementById('expense-list'); expList.innerHTML = '';
            expenses.forEach((e,i) => { exp += e.amount; expList.innerHTML += `<div class="list-item"><span>${e.name}</span><span>$${e.amount} <button onclick="removeExpense(${i})">x</button></span></div>`; });
            document.getElementById('dash-revenue').innerText = `$${total}`;
            document.getElementById('dash-expense').innerText = `$${exp}`;
            document.getElementById('dash-cash').innerText = `$${cash}`;
            document.getElementById('dash-linepay').innerText = `$${lp}`;
            document.getElementById('dash-profit').innerText = `$${total - exp}`;
        }

        function endOfDay() {
            if(confirm('清空今日所有紀錄？')) {
                history = []; kitchenQueue = []; expenses = []; reservations = [];
                for(let t in tables) tables[t] = { pax: 0, cart: [], mergeNote: "" };
                saveData(); renderSummary(); alert('日結完成');
            }
        }

        function saveData() {
            localStorage.setItem('pos_menu_v6', JSON.stringify(menu));
            localStorage.setItem('pos_tables', JSON.stringify(tables));
            localStorage.setItem('pos_kitchen', JSON.stringify(kitchenQueue));
            localStorage.setItem('pos_history', JSON.stringify(history));
            localStorage.setItem('pos_expenses', JSON.stringify(expenses));
            localStorage.setItem('pos_reservations', JSON.stringify(reservations));
        }

        renderOrderView();
    </script>
