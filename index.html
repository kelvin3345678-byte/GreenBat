<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>簡易點餐與出餐系統</title>
    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; --text: #1C1C1E; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: var(--bg); color: var(--text); }
        nav { display: flex; background: white; padding: 10px; border-bottom: 1px solid #ccc; position: sticky; top: 0; z-index: 100; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none;}
        nav::-webkit-scrollbar { display: none; }
        nav button { flex-shrink: 0; padding: 10px 15px; margin: 0 4px; border: none; border-radius: 8px; background: #e5e5ea; font-size: 15px; cursor: pointer;}
        nav button.active { background: var(--primary); color: white; }
        .container { padding: 15px; display: none; }
        .container.active { display: block; }
        
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; font-family: inherit;}
        textarea { resize: vertical; height: 60px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-bottom: 10px; font-weight: bold;}
        .btn-blue { background: var(--primary); color: white; }
        .btn-green { background: #34C759; color: white; }
        .btn-red { background: #FF3B30; color: white; }
        .btn-orange { background: #FF9500; color: white; }
        
        .list-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; align-items: center;}
        .total-price { font-size: 24px; font-weight: bold; text-align: right; margin: 15px 0; color: #FF3B30; }
        
        /* 廚房與歷史訂單卡片 */
        .kitchen-task { border-left: 6px solid #FF9500; display: flex; justify-content: space-between; align-items: center; }
        .history-card { padding: 12px; border: 1px solid #e5e5ea; border-radius: 8px; margin-bottom: 10px; background: #fafafa; }
        .history-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #ccc; padding-bottom: 8px; margin-bottom: 8px; font-size: 14px;}
        .history-items { font-size: 13px; color: #555; line-height: 1.6; }
        
        /* 表單排版 */
        .select-row { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        .select-row select, .select-row input { margin: 0; }
        .select-row button { margin: 0; width: auto; padding: 10px 20px; }

        /* 儀表板排版 */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .dash-box { padding: 10px; border-radius: 8px; text-align: center; }
        .dash-title { font-size: 12px; color: #666; display: block; margin-bottom: 5px; }
        .dash-value { font-size: 20px; font-weight: bold; }

        /* 用餐人數按鈕排版 */
        .pax-control { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .pax-control input { margin: 0; text-align: center; flex: 1; font-weight: bold; font-size: 18px;}
        .pax-btn { background: #e5e5ea; border: none; font-size: 22px; font-weight: bold; border-radius: 8px; width: 45px; height: 45px; cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center;}
        .pax-btn:active { background: #d1d1d6; }

        /* 結帳與核取方塊樣式 */
        .item-checkout-cb { width: 22px; height: 22px; margin-right: 12px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
        .checkout-qty-select { padding: 4px; margin: 0 10px 0 0; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; background: white;}
    </style>
</head>
<body>

    <nav>
        <button id="tab-order" class="active" onclick="switchTab('order')">🍽️ 桌位/點餐</button>
        <button id="tab-reservation" onclick="switchTab('reservation')">📝 訂位</button>
        <button id="tab-kitchen" onclick="switchTab('kitchen')">👨‍🍳 廚房出餐</button>
        <button id="tab-menu" onclick="switchTab('menu')">📂 菜單管理</button>
        <button id="tab-summary" onclick="switchTab('summary')">📊 今日帳務</button>
        <button id="tab-stats" onclick="switchTab('stats')">📈 銷售統計</button>
    </nav>

    <div id="order-view" class="container active">
        <div class="card">
            <label>選擇桌號：</label>
            <select id="table-select" onchange="loadTableData()">
                <option value="1">第 1 桌</option>
                <option value="2">第 2 桌</option>
                <option value="3">第 3 桌</option>
                <option value="4">第 4 桌</option>
                <option value="5">第 5 桌</option>
                <option value="吧檯">吧檯</option>
                <option value="沙發區">沙發區</option>
            </select>
            
            <label>併桌備註 (選填)：</label>
            <input type="text" id="merge-note" placeholder="例如：3位 或 併入第3桌" onchange="saveTableData()">
            
            <label>用餐人數：</label>
            <div class="pax-control">
                <button class="pax-btn" onclick="changePax(-1)">-</button>
                <input type="number" id="pax-input" placeholder="人數" value="2" onchange="saveTableData()">
                <button class="pax-btn" onclick="changePax(1)">+</button>
            </div>
        </div>

        <div class="card">
            <h3>選擇餐點</h3>
            <label>🍱 食物類：</label>
            <div class="select-row">
                <select id="food-select" style="flex:1;"></select>
                <button class="btn btn-blue" onclick="addFromSelect('food-select')">加入</button>
            </div>

            <label>🥤 飲品類：</label>
            <div class="select-row">
                <select id="drink-select" style="flex:1;"></select>
                <button class="btn btn-blue" onclick="addFromSelect('drink-select')">加入</button>
            </div>
        </div>

        <div class="card">
            <h3>目前桌邊餐點</h3>
            <!-- 💡 新增：全選與全不選按鈕 -->
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button class="btn btn-blue" style="padding: 8px; margin: 0; flex: 1;" onclick="toggleAllCheckout(true)">☑️ 全選</button>
                <button class="btn" style="background: #e5e5ea; color: #333; padding: 8px; margin: 0; flex: 1;" onclick="toggleAllCheckout(false)">☐ 全不選</button>
            </div>
            
            <div id="cart-list"></div>
            
            <div style="border-top: 2px dashed #eee; margin-top: 15px; padding-top: 15px;">
                <div style="font-size: 16px; color: #333; display: flex; justify-content: flex-end; align-items: center; margin-bottom: 5px;">
                    <span style="color:#FF9500; font-size: 14px;">(促銷/買送一)</span> 折扣/折讓：-$ 
                    <input type="number" id="checkout-discount" value="0" style="width: 80px; padding: 5px; margin-left: 10px; margin-bottom: 0; text-align: right;" onchange="updateCheckoutTotal()" onkeyup="updateCheckoutTotal()">
                </div>
                <div class="total-price" style="margin-top: 5px;">選取實收總計: $<span id="cart-total">0</span></div>
            </div>
            
            <label>本次點餐備註：</label>
            <textarea id="order-remark" placeholder="例如：飯少、盡快上菜、拿鐵去冰..."></textarea>
            
            <button class="btn btn-orange" onclick="sendOrder()">📤 送出點餐至廚房</button>

            <div style="margin-top: 25px; border-top: 2px dashed #ccc; padding-top: 15px;">
                <h4 style="margin-top: 0; color: #666;">👇 勾選品項結帳區</h4>
                <button class="btn btn-blue" onclick="checkout('現金')">💵 現金結帳</button>
                <!-- 💡 修正：更名為轉帳 -->
                <button class="btn btn-green" onclick="checkout('轉帳')">📱 轉帳結帳</button>
            </div>
        </div>
    </div>

    <div id="reservation-view" class="container">
        <div class="card">
            <h3>新增訂位</h3>
            <p style="font-size: 14px; color: #666; margin-top: 0;">請依照 <b>名稱,時間,人數</b> 格式輸入 (逗號隔開)</p>
            <div class="select-row">
                <input type="text" id="res-input" placeholder="例如：程小姐,21:00,x2" style="flex: 1;">
                <button class="btn btn-blue" onclick="addReservation()">新增</button>
            </div>
        </div>

        <div class="card">
            <h3>今日訂位列表 (依時間排序)</h3>
            <div id="reservation-list"></div>
        </div>
    </div>

    <div id="kitchen-view" class="container">
        <div class="card">
            <h3>待出餐排序 (越上層越早點)</h3>
            <div id="kitchen-list"></div>
        </div>
    </div>

    <div id="menu-view" class="container">
        <div class="card">
            <h3>新增品項</h3>
            <input type="text" id="new-item-name" placeholder="品項名稱 (例: 滷肉飯)">
            <input type="number" id="new-item-price" placeholder="價格 (例: 50)">
            <select id="new-item-category">
                <option value="食物">食物</option>
                <option value="飲品">飲品</option>
            </select>
            <button class="btn btn-blue" onclick="addMenuItem()">新增至菜單</button>
        </div>
        <div class="card">
            <h3>現有菜單</h3>
            <div id="admin-menu-list"></div>
        </div>
    </div>

    <div id="summary-view" class="container">
        <div class="card">
            <h3>營業統計</h3>
            
            <div class="dashboard-grid">
                <div class="dash-box" style="background: #e5e5ea;">
                    <span class="dash-title">💰 總營業額</span>
                    <span class="dash-value" id="dash-revenue">$0</span>
                </div>
                <div class="dash-box" style="background: #ffebee;">
                    <span class="dash-title">💸 總支出</span>
                    <span class="dash-value" style="color: #FF3B30;" id="dash-expense">$0</span>
                </div>
                <div class="dash-box" style="background: #e8f5e9;">
                    <span class="dash-title">💵 現金收入</span>
                    <span class="dash-value" style="color: #34C759;" id="dash-cash">$0</span>
                </div>
                <!-- 💡 修正：更名為轉帳 -->
                <div class="dash-box" style="background: #e3f2fd;">
                    <span class="dash-title">📱 轉帳收入</span>
                    <span class="dash-value" style="color: #007AFF;" id="dash-transfer">$0</span>
                </div>
            </div>

            <div class="dash-box" style="background: #fff3e0; border: 2px solid #FF9500;">
                <span class="dash-title" style="font-size: 14px;">🏆 今日淨利 (營業額 - 支出)</span>
                <span class="dash-value" style="font-size: 28px; color: #FF9500;" id="dash-profit">$0</span>
            </div>
            
            <h3 style="margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px;">新增支出明細</h3>
            <div class="select-row">
                <input type="text" id="expense-name" placeholder="支出品項 (例: 菜錢)" style="flex: 2;">
                <input type="number" id="expense-amount" placeholder="金額" style="flex: 1;">
                <button class="btn btn-red" onclick="addExpense()">記錄</button>
            </div>
            <div id="expense-list"></div>
        </div>
        
        <div class="card">
            <h3>帳單紀錄 (含明細)</h3>
            <div id="history-list"></div>
            <br>
            <button class="btn btn-red" onclick="endOfDay()">執行日結 (清空今日所有紀錄)</button>
        </div>
    </div>

    <!-- 💡 新增：銷售統計分頁 -->
    <div id="stats-view" class="container">
        <div class="card">
            <h3>整體營收概覽</h3>
            <div class="dashboard-grid">
                <div class="dash-box" style="background: #e5e5ea;">
                    <span class="dash-title">💰 總營業額</span>
                    <span class="dash-value" id="stats-total-revenue">$0</span>
                </div>
                <div class="dash-box" style="background: #ffebee;">
                    <span class="dash-title">💸 總支出</span>
                    <span class="dash-value" style="color: #FF3B30;" id="stats-total-expense">$0</span>
                </div>
            </div>
            
            <h3 style="margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px;">📊 餐點銷售排行 (備料參考)</h3>
            <div id="stats-item-list">
                <!-- 統計資料渲染於此 -->
            </div>
        </div>
    </div>

    <script>
        const defaultMenu = [
            { id: 101, name: '美式咖啡 (冰)', price: 150, category: '飲品' },
            { id: 102, name: '美式咖啡 (熱)', price: 150, category: '飲品' },
            { id: 103, name: '西西里咖啡 (冰)', price: 180, category: '飲品' },
            { id: 104, name: '拿鐵 (冰)', price: 180, category: '飲品' },
            { id: 105, name: '拿鐵 (熱)', price: 180, category: '飲品' },
            { id: 106, name: '焦糖烤花生風味拿鐵 (冰)', price: 190, category: '飲品' },
            { id: 107, name: '焦糖烤花生風味拿鐵 (熱)', price: 190, category: '飲品' },
            { id: 108, name: '榛果風味拿鐵 (冰)', price: 190, category: '飲品' },
            { id: 109, name: '榛果風味拿鐵 (熱)', price: 190, category: '飲品' },
            { id: 110, name: '蜂蜜風味拿鐵 (冰)', price: 190, category: '飲品' },
            { id: 111, name: '蜂蜜風味拿鐵 (熱)', price: 190, category: '飲品' },
            { id: 201, name: '阿薩姆紅茶 (冰)', price: 150, category: '飲品' },
            { id: 202, name: '阿薩姆紅茶 (熱)', price: 150, category: '飲品' },
            { id: 203, name: '鮮奶茶 (冰)', price: 170, category: '飲品' },
            { id: 204, name: '鮮奶茶 (熱)', price: 170, category: '飲品' },
            { id: 205, name: '蜂蜜紅茶 (冰)', price: 160, category: '飲品' },
            { id: 206, name: '蜂蜜紅茶 (熱)', price: 160, category: '飲品' },
            { id: 207, name: '蜂蜜鮮奶茶 (冰)', price: 180, category: '飲品' },
            { id: 208, name: '蜂蜜鮮奶茶 (熱)', price: 180, category: '飲品' },
            { id: 209, name: '紫蘇紅茶 (冰)', price: 160, category: '飲品' },
            { id: 210, name: '紫蘇紅茶 (熱)', price: 160, category: '飲品' },
            { id: 211, name: '高冷玉烏龍 (熱/可回沖)', price: 200, category: '飲品' },
            { id: 212, name: '乳香金萱 (熱/可回沖)', price: 180, category: '飲品' },
            { id: 213, name: '南非國寶茶(無咖啡因) (熱/可回沖)', price: 180, category: '飲品' },
            { id: 214, name: '玫瑰安神花草茶(無咖啡因) (熱/可回沖)', price: 180, category: '飲品' },
            { id: 215, name: '薰衣草安神花草茶(無咖啡因) (熱/可回沖)', price: 180, category: '飲品' },
            { id: 301, name: '漂浮可樂 (冰)', price: 170, category: '飲品' },
            { id: 302, name: '漂浮咖啡 (冰)', price: 170, category: '飲品' },
            { id: 303, name: '鮮奶油可可飲 (冰)', price: 180, category: '飲品' },
            { id: 304, name: '鮮奶油可可飲 (熱)', price: 180, category: '飲品' },
            { id: 401, name: '牛五花丼飯', price: 230, category: '食物' },
            { id: 402, name: '豬五花丼飯', price: 220, category: '食物' },
            { id: 403, name: '香料火腿起司拼盤', price: 380, category: '食物' },
            { id: 404, name: '高麗菜豬肉水餃', price: 150, category: '食物' },
            { id: 501, name: '生啤酒', price: 150, category: '飲品' }
        ];

        let menu = JSON.parse(localStorage.getItem('pos_menu_v5')) || defaultMenu;
        
        let tables = JSON.parse(localStorage.getItem('pos_tables')) || {};
        const tableNames = ['1', '2', '3', '4', '5', '吧檯', '沙發區'];
        tableNames.forEach(t => {
            if (!tables[t]) tables[t] = { pax: 0, cart: [], mergeNote: "" };
        });

        let kitchenQueue = JSON.parse(localStorage.getItem('pos_kitchen')) || [];
        let history = JSON.parse(localStorage.getItem('pos_history')) || [];
        let expenses = JSON.parse(localStorage.getItem('pos_expenses')) || []; 
        let reservations = JSON.parse(localStorage.getItem('pos_reservations')) || []; 
        let currentTable = "1";

        function switchTab(tabName) {
            document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName + '-view').classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
            
            if(tabName === 'order') {
                renderOrderView();
                renderCart(); 
            }
            if(tabName === 'reservation') renderReservations();
            if(tabName === 'kitchen') renderKitchenView();
            if(tabName === 'menu') renderMenuAdmin();
            if(tabName === 'summary') renderSummary();
            if(tabName === 'stats') renderStats(); // 💡 觸發統計渲染
        }

        function addReservation() {
            let inputStr = document.getElementById('res-input').value.trim();
            if(!inputStr) return;
            
            inputStr = inputStr.replace(/，/g, ',');
            let parts = inputStr.split(/,|，/).map(p => p.trim());
            
            if(parts.length < 3) {
                alert('格式不正確！請確認包含名稱、時間、人數，並以逗號隔開。\n例如：程小姐,21:00,x2');
                return;
            }

            reservations.push({
                id: Date.now(),
                name: parts[0],
                time: parts[1],
                pax: parts[2],
                arrived: false,
                cancelled: false
            });

            document.getElementById('res-input').value = '';
            saveData();
            renderReservations();
        }

        function toggleReservation(id) {
            let target = reservations.find(r => r.id == id);
            if(target && !target.cancelled) {
                target.arrived = !target.arrived; 
                saveData();
                renderReservations();
            }
        }

        function cancelReservation(id) {
            if(!confirm('確定要撤銷此筆訂位嗎？（撤銷後仍會保留紀錄供查詢）')) return;
            let target = reservations.find(r => r.id == id);
            if(target) {
                target.cancelled = true; 
                saveData();
                renderReservations();
            }
        }

        function renderReservations() {
            const list = document.getElementById('reservation-list');
            list.innerHTML = '';
            
            reservations.sort((a, b) => {
                let timeA = a.time.padStart(5, '0');
                let timeB = b.time.padStart(5, '0');
                return timeA.localeCompare(timeB);
            });

            if(reservations.length === 0) {
                list.innerHTML = '<div style="color:#999; font-size:14px; text-align:center; padding:20px;">今日尚無訂位資料</div>';
                return;
            }

            reservations.forEach(res => {
                let btnClass = res.arrived ? "btn-green" : "btn-orange";
                let btnText = res.arrived ? "✅ 已入座" : "等候中"; 
                
                if (res.cancelled) {
                    list.innerHTML += `
                        <div class="list-item" style="opacity: 0.4; background: #f9f9f9;">
                            <div>
                                <span style="font-size: 20px; font-weight: bold; color: #999; text-decoration: line-through;">${res.time}</span>
                                <span style="margin-left: 15px; font-size: 18px; font-weight: bold; color: #999; text-decoration: line-through;">${res.name}</span>
                                <span style="margin-left: 10px; color: #999; font-size: 14px;">(${res.pax})</span>
                            </div>
                            <span style="color: #FF3B30; font-weight: bold; font-size: 14px; padding: 10px;">已撤銷</span>
                        </div>
                    `;
                } else {
                    let opacity = res.arrived ? "0.6" : "1"; 
                    list.innerHTML += `
                        <div class="list-item" style="opacity: ${opacity};">
                            <div>
                                <span style="font-size: 20px; font-weight: bold; color: var(--primary);">${res.time}</span>
                                <span style="margin-left: 15px; font-size: 18px; font-weight: bold;">${res.name}</span>
                                <span style="margin-left: 10px; color: #666; font-size: 14px;">(${res.pax})</span>
                            </div>
                            <div style="display: flex; gap: 5px;">
                                <button onclick="toggleReservation('${res.id}')" class="btn ${btnClass}" style="width: auto; padding: 10px; margin: 0; min-width: 80px;">${btnText}</button>
                                <button onclick="cancelReservation('${res.id}')" class="btn btn-red" style="width: auto; padding: 10px; margin: 0; font-size: 14px;">撤銷</button>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function renderMenuAdmin() {
            const list = document.getElementById('admin-menu-list');
            list.innerHTML = '';
            menu.forEach((item, index) => {
                list.innerHTML += `
                    <div class="list-item">
                        <span>${item.name} ($${item.price}) - ${item.category}</span>
                        <button onclick="removeMenuItem(${index})" style="background:#FF3B30; color:white; border:none; padding:5px 10px; border-radius:5px;">刪除</button>
                    </div>
                `;
            });
            saveData();
        }

        function addMenuItem() {
            const name = document.getElementById('new-item-name').value;
            const price = parseInt(document.getElementById('new-item-price').value);
            const category = document.getElementById('new-item-category').value;
            
            if(!name || !price) return alert('請填寫完整資訊');
            menu.push({ id: Date.now(), name, price, category });
            
            document.getElementById('new-item-name').value = '';
            document.getElementById('new-item-price').value = '';
            renderMenuAdmin();
            if(document.getElementById('order-view').classList.contains('active')) renderOrderView();
        }

        function removeMenuItem(index) {
            menu.splice(index, 1);
            renderMenuAdmin();
        }

        function renderOrderView() {
            const foodSelect = document.getElementById('food-select');
            const drinkSelect = document.getElementById('drink-select');
            
            foodSelect.innerHTML = '';
            drinkSelect.innerHTML = '';
            
            let hasFood = false;
            let hasDrink = false;

            menu.forEach(item => {
                const optionHtml = `<option value="${item.id}">${item.name} ($${item.price})</option>`;
                if (item.category === '食物') {
                    foodSelect.innerHTML += optionHtml;
                    hasFood = true;
                } else if (item.category === '飲品') {
                    drinkSelect.innerHTML += optionHtml;
                    hasDrink = true;
                }
            });

            if (!hasFood) foodSelect.innerHTML = '<option value="">(目前無食物品項)</option>';
            if (!hasDrink) drinkSelect.innerHTML = '<option value="">(目前無飲品品項)</option>';

            loadTableData();
        }

        function addFromSelect(selectId) {
            const selectElement = document.getElementById(selectId);
            const itemId = parseInt(selectElement.value);
            if (!itemId) return; 
            addToCart(itemId);
        }

        function updateTableDisplay() {
            const select = document.getElementById('table-select');
            for (let i = 0; i < select.options.length; i++) {
                let t = select.options[i].value;
                let cart = tables[t].cart;
                
                let cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                let status = '(空桌)';
                
                if (cartTotal > 0) {
                    let allServed = cart.length > 0 && cart.every(item => item.status === 'served');
                    if (allServed) {
                        status = `(未結帳 $${cartTotal} - ✅已出餐)`;
                    } else {
                        status = `(未結帳 $${cartTotal})`;
                    }
                }
                
                let displayName = ['1','2','3','4','5'].includes(t) ? `第 ${t} 桌` : t;
                let mergeTag = tables[t].mergeNote ? ` (併桌 ${tables[t].mergeNote})` : "";
                
                select.options[i].text = `${displayName}${mergeTag} ${status}`;
            }
        }

        function loadTableData() {
            currentTable = document.getElementById('table-select').value;
            document.getElementById('pax-input').value = tables[currentTable].pax || '';
            document.getElementById('merge-note').value = tables[currentTable].mergeNote || ''; 
            document.getElementById('order-remark').value = '';
            document.getElementById('checkout-discount').value = '0';
            renderCart();
        }

        function changePax(delta) {
            let input = document.getElementById('pax-input');
            let currentVal = parseInt(input.value) || 0;
            let newVal = currentVal + delta;
            if (newVal < 0) newVal = 0; 
            input.value = newVal;
            saveTableData(); 
        }

        function saveTableData() {
            tables[currentTable].pax = document.getElementById('pax-input').value;
            tables[currentTable].mergeNote = document.getElementById('merge-note').value; 
            saveData(); 
            updateTableDisplay(); 
        }

        function addToCart(itemId) {
            const item = menu.find(m => m.id === itemId);
            const cart = tables[currentTable].cart;
            
            const existingUnsent = cart.find(c => c.id === itemId && c.status === 'unsent');
            if(existingUnsent) {
                existingUnsent.qty++;
            } else {
                // 💡 預設加入時為「不勾選」狀態 (checkoutSelected: false)
                cart.push({ ...item, qty: 1, status: 'unsent', checkoutSelected: false });
            }
            
            if(tables[currentTable].pax == 0) {
                tables[currentTable].pax = 1;
                document.getElementById('pax-input').value = 1;
            }
            saveTableData();
            renderCart();
        }

        function removeOneFromCart(index) {
            const cart = tables[currentTable].cart;
            cart[index].qty--;
            if(cart[index].qty === 0) cart.splice(index, 1);
            saveData();
            renderCart();
        }

        // 💡 新增：全選 / 全不選切換功能
        function toggleAllCheckout(selectAll) {
            const cart = tables[currentTable].cart;
            cart.forEach(item => {
                item.checkoutSelected = selectAll;
            });
            renderCart(); // 內部會觸發 updateCheckoutTotal
        }

        function updateCheckoutTotal() {
            const cart = tables[currentTable].cart;
            const checkboxes = document.querySelectorAll('.item-checkout-cb');
            let selectedTotal = 0;
            
            checkboxes.forEach(cb => {
                let idx = parseInt(cb.dataset.index);
                // 記錄勾選狀態
                cart[idx].checkoutSelected = cb.checked;
                
                if (cb.checked) {
                    let qtySelect = document.getElementById('checkout-qty-' + idx);
                    let checkoutQty = qtySelect ? parseInt(qtySelect.value) : cart[idx].qty;
                    selectedTotal += cart[idx].price * checkoutQty;
                }
            });
            
            let discount = parseInt(document.getElementById('checkout-discount').value) || 0;
            let finalTotal = Math.max(0, selectedTotal - discount);
            
            document.getElementById('cart-total').innerText = finalTotal;
        }

        function renderCart() {
            const cart = tables[currentTable].cart;
            const list = document.getElementById('cart-list');
            list.innerHTML = '';
            
            cart.forEach((item, index) => {
                if(!item.status) item.status = item.isSent ? 'preparing' : 'unsent';
                let statusBadge = '';
                let actionBtn = '';

                if (item.status === 'unsent') {
                    actionBtn = `<button onclick="removeOneFromCart(${index})" style="background:#ccc; border:none; padding:5px 10px; border-radius:5px;">-1</button>`;
                } else if (item.status === 'preparing') {
                    let servedText = item.servedQty ? `(出${item.servedQty},剩${item.qty - item.servedQty})` : '(製作中)';
                    statusBadge = `<span style="color:#FF9500; font-size:12px; margin-left:5px;">${servedText}</span>`;
                    actionBtn = `<span style="font-size:13px; color:#FF9500; font-weight:bold;">👨‍🍳 製作中</span>`;
                } else if (item.status === 'served') {
                    statusBadge = `<span style="color:#34C759; font-size:12px; margin-left:5px;">(已出餐)</span>`;
                    actionBtn = `<span style="font-size:13px; color:#34C759; font-weight:bold;">✅ 已出餐</span>`;
                }

                let qtySelectHtml = '';
                if (item.qty > 1) {
                    qtySelectHtml = `<select id="checkout-qty-${index}" class="checkout-qty-select" onchange="updateCheckoutTotal()">`;
                    for(let i = 1; i <= item.qty; i++) {
                        // 如果有上次記錄的結帳數量，維持它，否則預設選最大值
                        let isSelected = item.checkoutQty ? (i === item.checkoutQty) : (i === item.qty);
                        qtySelectHtml += `<option value="${i}" ${isSelected ? 'selected' : ''}>結 ${i}</option>`;
                    }
                    qtySelectHtml += `</select>`;
                }

                // 💡 讀取紀錄的勾選狀態 (若未定義則預設不勾選)
                let checkedAttr = (item.checkoutSelected === true) ? 'checked' : '';

                list.innerHTML += `
                    <div class="list-item">
                        <div style="display: flex; align-items: center;">
                            <input type="checkbox" class="item-checkout-cb" data-index="${index}" onchange="updateCheckoutTotal()" ${checkedAttr}>
                            <span>${item.name} x ${item.qty} ${statusBadge}<br><small style="color:#666;">單價 $${item.price}</small></span>
                        </div>
                        <div style="display: flex; align-items: center;">
                            ${qtySelectHtml}
                            ${actionBtn}
                        </div>
                    </div>
                `;
            });
            
            updateTableDisplay();
            updateCheckoutTotal(); 
        }

        function sendOrder() {
            const cart = tables[currentTable].cart;
            const unsentItems = cart.filter(item => item.status === 'unsent' || !item.status);
            
            if(unsentItems.length === 0) return alert('目前沒有新的餐點可以送出喔！');
            
            const remark = document.getElementById('order-remark').value;
            const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

            unsentItems.forEach(item => {
                item.status = 'preparing';
                item.servedQty = 0; 
                item.taskId = Date.now() + Math.random().toString(36).substr(2, 5);
                
                kitchenQueue.push({
                    taskId: item.taskId,
                    table: currentTable,
                    name: item.name,
                    qty: item.qty,
                    remark: remark,
                    time: timeStr
                });
            });

            document.getElementById('order-remark').value = '';
            saveData();
            
            let displayName = ['1','2','3','4','5'].includes(currentTable) ? `第 ${currentTable} 桌` : currentTable;
            alert(`✅ ${displayName} 點餐已送至廚房！`);
            renderCart();
        }

        function renderKitchenView() {
            const list = document.getElementById('kitchen-list');
            list.innerHTML = '';
            if(kitchenQueue.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding: 20px; color: #666;">目前沒有待出餐點 🎉</div>';
                return;
            }

            kitchenQueue.forEach(task => {
                let remarkHtml = task.remark ? `<div style="color: #FF3B30; font-size: 14px; margin-top: 5px;">📝 備註: ${task.remark}</div>` : '';
                let displayTable = ['1','2','3','4','5'].includes(task.table) ? `第 ${task.table} 桌` : task.table;
                
                let qtySelectHtml = '';
                if (task.qty > 1) {
                    qtySelectHtml = `<select id="serve-qty-${task.taskId}" style="padding: 5px; margin-right: 10px; border-radius: 5px; font-size: 14px;">`;
                    for(let i = 1; i <= task.qty; i++) {
                        qtySelectHtml += `<option value="${i}" ${i === task.qty ? 'selected' : ''}>出 ${i} 份</option>`;
                    }
                    qtySelectHtml += `</select>`;
                }

                list.innerHTML += `
                    <div class="card kitchen-task">
                        <div>
                            <span style="background: #eee; padding: 3px 8px; border-radius: 5px; font-size: 14px;">桌號: <strong>${displayTable}</strong></span>
                            <span style="color: #666; font-size: 14px; margin-left: 10px;">🕒 ${task.time}</span>
                            <div style="font-size: 20px; font-weight: bold; margin-top: 8px;">
                                ${task.name} <span style="color: var(--primary);">x ${task.qty}</span>
                            </div>
                            ${remarkHtml}
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-end;">
                            <div style="display: flex; align-items: center;">
                                ${qtySelectHtml}
                                <button class="btn btn-green" style="width: auto; padding: 10px 15px; margin: 0;" onclick="markAsServed('${task.taskId}', '${task.table}')">✅ 出餐</button>
                            </div>
                            <button class="btn" style="width: auto; padding: 5px 10px; margin: 0; font-size: 14px; background: transparent; color: #FF3B30; border: 1px solid #FF3B30;" onclick="cancelKitchenTask('${task.taskId}', '${task.table}')">❌ 撤單</button>
                        </div>
                    </div>
                `;
            });
        }

        function markAsServed(taskId, tableNum) {
            let taskIndex = kitchenQueue.findIndex(t => t.taskId === taskId);
            if(taskIndex === -1) return;
            let task = kitchenQueue[taskIndex];

            let serveQty = task.qty;
            let qtySelect = document.getElementById('serve-qty-' + taskId);
            if(qtySelect) serveQty = parseInt(qtySelect.value);

            let cartItem = tables[tableNum]?.cart.find(c => c.taskId === taskId);
            if(cartItem) {
                cartItem.servedQty = (cartItem.servedQty || 0) + serveQty;
            }

            task.qty -= serveQty;
            if(task.qty <= 0) {
                kitchenQueue.splice(taskIndex, 1);
                if(cartItem && cartItem.servedQty >= cartItem.qty) {
                    cartItem.status = 'served';
                }
            }

            saveData();
            renderKitchenView();
            if(document.getElementById('order-view').classList.contains('active')) renderCart();
        }

        function cancelKitchenTask(taskId, tableNum) {
            if(!confirm('確定要撤銷此餐點嗎？\n(這將從該桌的未結帳清單中扣除相對應的數量)')) return;

            let taskIndex = kitchenQueue.findIndex(t => t.taskId === taskId);
            if(taskIndex === -1) return;
            let task = kitchenQueue[taskIndex];

            if(tables[tableNum]) {
                let cartItem = tables[tableNum].cart.find(c => c.taskId === taskId);
                if(cartItem) {
                    cartItem.qty -= task.qty; 
                    if(cartItem.qty <= 0) {
                        tables[tableNum].cart = tables[tableNum].cart.filter(c => c.taskId !== taskId);
                    } else if ((cartItem.servedQty || 0) >= cartItem.qty) {
                        cartItem.status = 'served';
                    }
                }
            }

            kitchenQueue.splice(taskIndex, 1);
            saveData();
            renderKitchenView();
            if(document.getElementById('order-view').classList.contains('active')) renderCart();
        }


        function checkout(paymentMethod) {
            const cart = tables[currentTable].cart;
            if(cart.length === 0) return alert('這桌是空的，無須結帳！');
            
            const checkboxes = document.querySelectorAll('.item-checkout-cb');
            let checkedIndices = [];
            checkboxes.forEach(cb => {
                if (cb.checked) checkedIndices.push(parseInt(cb.dataset.index));
            });

            if (checkedIndices.length === 0) return alert('請先勾選要結帳的品項！');

            checkedIndices.sort((a, b) => b - a);

            let subTotal = 0;
            let checkoutItems = [];
            let hasUnserved = false;

            checkedIndices.forEach(idx => {
                const item = cart[idx];
                const inKitchen = kitchenQueue.some(q => q.taskId === item.taskId);
                if (inKitchen || item.status !== 'served') hasUnserved = true;
            });

            if(hasUnserved) {
                if(!confirm(`⚠️ 勾選的品項中包含尚未出餐的餐點，確定要結帳嗎？`)) return;
            }

            checkedIndices.forEach(idx => {
                const item = cart[idx];
                let qtySelect = document.getElementById('checkout-qty-' + idx);
                let checkoutQty = qtySelect ? parseInt(qtySelect.value) : item.qty;
                
                subTotal += item.price * checkoutQty;
                
                let recordItem = JSON.parse(JSON.stringify(item));
                recordItem.qty = checkoutQty;
                checkoutItems.push(recordItem);
                
                item.qty -= checkoutQty;
                item.servedQty = Math.max(0, (item.servedQty || 0) - checkoutQty);
                // 重置該項目勾選狀態
                item.checkoutSelected = false; 
                
                if (item.qty <= 0) {
                    cart.splice(idx, 1);
                }
            });

            checkoutItems.reverse(); 

            let discount = parseInt(document.getElementById('checkout-discount').value) || 0;
            let finalTotal = Math.max(0, subTotal - discount);

            history.push({
                table: currentTable,
                pax: tables[currentTable].pax,
                total: finalTotal,
                discount: discount, 
                method: paymentMethod,
                time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }),
                items: checkoutItems 
            });

            let displayName = ['1','2','3','4','5'].includes(currentTable) ? `第 ${currentTable} 桌` : currentTable;

            if (cart.length === 0) {
                tables[currentTable] = { pax: 0, cart: [], mergeNote: "" };
                kitchenQueue = kitchenQueue.filter(task => task.table !== currentTable); 
                document.getElementById('merge-note').value = '';
                document.getElementById('pax-input').value = '0';
                document.getElementById('checkout-discount').value = '0';
                alert(`💰 結帳完成！\n方式：${paymentMethod}\n實收：$${finalTotal}\n(${displayName} 已全數結清並清空)`);
            } else {
                document.getElementById('checkout-discount').value = '0';
                alert(`💰 部分結帳完成！\n方式：${paymentMethod}\n實收：$${finalTotal}\n(未結帳品項仍保留於桌上)`);
            }

            saveData();
            loadTableData(); 
        }

        function addExpense() {
            const name = document.getElementById('expense-name').value;
            const amount = parseInt(document.getElementById('expense-amount').value);
            
            if (!name || !amount) return alert('請填寫支出項目與金額！');
            
            expenses.push({ name, amount });
            document.getElementById('expense-name').value = '';
            document.getElementById('expense-amount').value = '';
            
            saveData();
            renderSummary();
        }

        function removeExpense(index) {
            expenses.splice(index, 1);
            saveData();
            renderSummary();
        }

        function renderSummary() {
            let totalRevenue = 0;
            let cashTotal = 0;
            let transferTotal = 0;

            const list = document.getElementById('history-list');
            list.innerHTML = '';

            const reversedHistory = [...history].reverse();
            reversedHistory.forEach(record => {
                totalRevenue += record.total;
                if (record.method === '現金') cashTotal += record.total;
                if (record.method === '轉帳') transferTotal += record.total; // 💡 修改為轉帳
                
                let itemsHtml = '';
                if(record.items && record.items.length > 0) {
                    record.items.forEach(item => {
                        itemsHtml += `<div>🔸 ${item.name} x ${item.qty} <span style="float:right;">$${item.price * item.qty}</span></div>`;
                    });
                } else {
                    itemsHtml = '<div style="color:#999;">(無明細紀錄)</div>';
                }
                
                let displayTable = ['1','2','3','4','5'].includes(record.table) ? `第 ${record.table} 桌` : record.table;
                let discountHtml = record.discount ? `<small style="color:#FF9500; font-weight:normal;">(含折扣 -$${record.discount})</small> ` : '';

                list.innerHTML += `
                    <div class="history-card">
                        <div class="history-header">
                            <span>桌號 <strong>${displayTable}</strong> | ${record.method}</span>
                            <span>🕒 ${record.time}</span>
                        </div>
                        <div class="history-items">
                            ${itemsHtml}
                        </div>
                        <div style="text-align: right; margin-top: 5px; font-size: 16px; font-weight: bold; color: #FF3B30;">
                            ${discountHtml}
                            總計: $${record.total}
                        </div>
                    </div>
                `;
            });

            const expList = document.getElementById('expense-list');
            expList.innerHTML = '';
            let totalExpense = 0;
            
            expenses.forEach((exp, index) => {
                totalExpense += exp.amount;
                expList.innerHTML += `
                    <div class="list-item" style="border-bottom: 1px dashed #ccc; padding: 5px 0;">
                        <span>🛒 ${exp.name}</span>
                        <div>
                            <span style="color:#FF3B30; margin-right:10px;">$${exp.amount}</span>
                            <button onclick="removeExpense(${index})" style="background:#eee; color:#FF3B30; border:none; padding:3px 8px; border-radius:5px;">刪除</button>
                        </div>
                    </div>
                `;
            });

            if (expenses.length === 0) {
                expList.innerHTML = '<div style="color:#999; font-size:14px; text-align:center; padding:10px;">目前尚無支出紀錄</div>';
            }

            let netProfit = totalRevenue - totalExpense;

            document.getElementById('dash-revenue').innerText = `$${totalRevenue}`;
            document.getElementById('dash-expense').innerText = `$${totalExpense}`;
            document.getElementById('dash-cash').innerText = `$${cashTotal}`;
            document.getElementById('dash-linepay').innerText = `$${transferTotal}`; // 💡 UI對應轉帳
            document.getElementById('dash-profit').innerText = `$${netProfit}`;
        }

        // 💡 新增：渲染銷售統計邏輯
        function renderStats() {
            let itemCounts = {};
            let totalRevenue = 0;
            
            // 1. 撈取歷史訂單計算銷售數量
            history.forEach(record => {
                totalRevenue += record.total;
                if(record.items) {
                    record.items.forEach(item => {
                        if(!itemCounts[item.name]) {
                            itemCounts[item.name] = { count: 0, category: item.category };
                        }
                        itemCounts[item.name].count += item.qty;
                    });
                }
            });

            // 2. 計算總支出
            let totalExpense = expenses.reduce((sum, exp) => sum + exp.amount, 0);

            // 更新上方概覽數字
            document.getElementById('stats-total-revenue').innerText = `$${totalRevenue}`;
            document.getElementById('stats-total-expense').innerText = `$${totalExpense}`;

            // 3. 排序 (數量由大到小)
            let sortedItems = Object.keys(itemCounts)
                                    .map(key => ({ name: key, ...itemCounts[key] }))
                                    .sort((a, b) => b.count - a.count);

            const list = document.getElementById('stats-item-list');
            let html = '';
            
            if(sortedItems.length === 0) {
                html = '<div style="text-align:center; color:#999; padding:20px;">尚無結帳與銷售紀錄</div>';
            } else {
                sortedItems.forEach(it => {
                    html += `
                        <div class="list-item" style="border-bottom: 1px dashed #ccc; padding: 10px 0;">
                            <span>${it.name} <small style="color:#666; margin-left: 5px;">(${it.category})</small></span>
                            <strong style="color: var(--primary); font-size: 18px;">${it.count} 份</strong>
                        </div>
                    `;
                });
            }
            list.innerHTML = html;
        }

        function endOfDay() {
            if(confirm('確定要執行日結嗎？這將會清空今日所有「帳單紀錄」、「支出明細」與「訂位資料」！')) {
                history = [];
                kitchenQueue = []; 
                expenses = []; 
                reservations = []; 
                
                for(let t in tables) tables[t] = { pax: 0, cart: [], mergeNote: "" };
                
                saveData();
                renderSummary();
                if(document.getElementById('reservation-view').classList.contains('active')) renderReservations();
                if(document.getElementById('stats-view').classList.contains('active')) renderStats();
                alert('日結完成，系統已歸零準備迎接明天！');
            }
        }

        function saveData() {
            localStorage.setItem('pos_menu_v5', JSON.stringify(menu));
            localStorage.setItem('pos_tables', JSON.stringify(tables));
            localStorage.setItem('pos_kitchen', JSON.stringify(kitchenQueue));
            localStorage.setItem('pos_history', JSON.stringify(history));
            localStorage.setItem('pos_expenses', JSON.stringify(expenses)); 
            localStorage.setItem('pos_reservations', JSON.stringify(reservations)); 
        }

        renderOrderView();
    </script>
</body>
</html>
